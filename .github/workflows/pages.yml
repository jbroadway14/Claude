name: Deploy Hive Log to GitHub Pages

on:
  push:
    branches: [main, master, 'claude/beehive-inspection-tracker-4fltpx']
    paths: ['app/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Stamp service worker cache with commit
        run: sed -i "s/const VERSION = 'hivelog-v1'/const VERSION = 'hivelog-${GITHUB_SHA::8}'/" app/sw.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app
      - id: deployment
        uses: actions/deploy-pages@v4
