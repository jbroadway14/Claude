<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Hive Log</title>
  <meta name="description" content="Offline beehive and inspection tracker for National and Langstroth hives.">
  <meta name="theme-color" content="#f5a524">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Hive Log">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <a href="#/" class="brand"><img src="icons/icon.svg" alt="" width="28" height="28"> Hive Log</a>
    <span id="topbar-extra"></span>
  </header>

  <main id="main" tabindex="-1">
    <p class="muted center">Loading…</p>
  </main>

  <nav class="tabbar" aria-label="Main">
    <a href="#/" data-tab="hives"><span aria-hidden="true">🐝</span>Hives</a>
    <a href="#/due" data-tab="due"><span aria-hidden="true">📅</span>Due</a>
    <a href="#/medicines" data-tab="medicines"><span aria-hidden="true">💊</span>Medicines</a>
    <a href="#/settings" data-tab="settings"><span aria-hidden="true">⚙️</span>More</a>
  </nav>

  <div id="toast" role="status" aria-live="polite"></div>

  <script src="app.js"></script>
</body>
</html>
